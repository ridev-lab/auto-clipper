name: Tests

on:
  push:
    branches: [main]
  pull_request:

# moindre privilège : lecture seule du dépôt
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Dépendances légères (sans GPU ni modèles)
        run: pip install -r requirements-ci.txt
      - name: Tests unitaires
        run: python -m pytest tests/test_units.py -q
      - name: Compilation de tous les modules
        run: python -m compileall -q clipper backend clipper.py server.py

  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # gitleaks liste les commits de la pull request via l'API
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
