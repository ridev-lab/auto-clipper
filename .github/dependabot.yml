version: 2
updates:
  # Dépendances Python (requirements.txt et requirements-ci.txt)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Les roues Windows des bibliothèques CUDA (cuBLAS, cuDNN) sortent souvent
      # après celles de Linux : Dependabot (sous Linux) proposerait des versions
      # impossibles à installer sous Windows. Mise à jour manuelle, testée sur GPU.
      - dependency-name: "nvidia-*"
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions GitHub utilisées par l'intégration continue
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
